plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services' // Pastikan ini ada di atas jika menggunakan Firebase
}

// ---------------------------------------------------------------------------------------
// 1. FUNGSI UNTUK MEMBACA KEY.PROPERTIES
// ---------------------------------------------------------------------------------------
def loadKeystoreProperties() {
    def keyProps = [:]
    // key.properties diasumsikan berada di folder 'android/' (satu tingkat di atas app/)
    def keyPropertiesFile = file('../key.properties')

    if (keyPropertiesFile.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(keyPropertiesFile))
        keyProps['storeFile'] = file(props['storeFile'])
        keyProps['storePassword'] = props['storePassword']
        keyProps['keyAlias'] = props['keyAlias']
        keyProps['keyPassword'] = props['keyPassword']
        println("✅ key.properties berhasil dimuat.")
    } else {
        println("❌ key.properties tidak ditemukan di ${keyPropertiesFile.getPath()}. App Bundle akan menggunakan signing config default (atau debug).")
    }
    return keyProps
}

def keystoreProperties = loadKeystoreProperties()


def getVersionCode() {
    def versionPropsFile = file('version.properties')

    if (versionPropsFile.canRead()) {
        def Properties versionProps = new Properties()
        versionProps.load(new FileInputStream(versionPropsFile))
        def code = versionProps['VERSION_CODE'].toInteger()
        return code
    } else {
        return 1
    }
}

def incrementVersionCode() {
    def versionPropsFile = file('version.properties')
    def code = 1

    if (versionPropsFile.canRead()) {
        def Properties versionProps = new Properties()
        versionProps.load(new FileInputStream(versionPropsFile))
        code = versionProps['VERSION_CODE'].toInteger() + 1
    }

    Properties versionProps = new Properties()
    versionProps['VERSION_CODE'] = code.toString()
    versionProps.store(versionPropsFile.newWriter(), null)
    return code
}

android {
    namespace = "com.baraja.baraja_app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    // ---------------------------------------------------------------------------------------
    // 2. DEFINISIKAN SIGNING CONFIG 'releaseKey'
    // ---------------------------------------------------------------------------------------
    signingConfigs {
        // Konfigurasi ini hanya dibuat jika key.properties berhasil dimuat
        if (keystoreProperties.containsKey('storeFile')) {
            create("releaseKey") {
                storeFile keystoreProperties['storeFile']
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                println("✅ Signing Config 'releaseKey' berhasil didefinisikan.")
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = "17"
    }


    defaultConfig {
        applicationId = "com.baraja.baraja_app"
        minSdk = 23
        targetSdk = 35

        // Auto increment versionCode
        versionCode = incrementVersionCode()
        versionName = flutter.versionName
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            // Biarkan ini menggunakan signingConfigs.debug (atau signing config default Flutter)
            // Sesuai permintaan: APK build tetap normal/cepat.
            signingConfig = signingConfigs.debug
//            sig   ningConfig signingConfigs.releaseKey
//            minifyEnabled false
//            shrinkResources false
//            debuggable false
        }
        debug {
            // Tidak perlu diubah, gunakan signingConfigs.debug (default)
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Pastikan Firebase BOM diimpor sebelum library spesifik
    implementation platform('com.google.firebase:firebase-bom:32.2.3')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}


afterEvaluate {
    def appName = "baraja_app"

    android.applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            // --- 3. LOGIC UNTUK AAB (file .aab): OVERRIDE SIGNING ---
            if (android.signingConfigs.findByName("releaseKey")) {
                def bundleTaskName = "bundle${variant.name.capitalize()}"

                tasks.named(bundleTaskName).configure { task ->
                    // --- Logika Rename AAB ---
                    task.doLast {
                        def aabDir = file("${buildDir}/outputs/bundle/${variant.buildType.name}")
                        def originalFile = file("${aabDir}/${appName}-${variant.buildType.name}.aab")

                        if (!originalFile.exists()) {
                            originalFile = file("${aabDir}/app-${variant.buildType.name}.aab")
                        }

                        if (originalFile.exists()) {
                            def newName = "${appName}-v${versionName}(${versionCode})-${variant.buildType.name}.aab"
                            def newFile = file("${aabDir}/${newName}")

                            copy {
                                from originalFile
                                into aabDir
                                rename { fileName -> newName }
                            }
                            println("✅ AAB berhasil digandakan dan diganti nama menjadi: ${newFile}")
                        } else {
                            println("❌ AAB file tidak ditemukan di lokasi yang diharapkan untuk variant: ${variant.name}")
                        }
                    }
                }
            }


            // --- LOGIC UNTUK APK (file .apk) ---
            variant.outputs.all { output ->
                // Memastikan ini adalah APK (biasanya output utama untuk assemble task)
                if (output.outputFileName.endsWith('.apk')) {
                    def outputDir = "${buildDir}/outputs/apk/${variant.buildType.name}"
                    def originalFile = output.outputFile
                    def newName = "${appName}-v${versionName}(${versionCode})-${variant.buildType.name}.apk"
                    def newFile = file("${outputDir}/${newName}")

                    // Hanya jalankan setelah task 'assemble' selesai
                    tasks.named("assemble${variant.name.capitalize()}").configure { task ->
                        task.doLast {
                            copy {
                                from originalFile
                                into outputDir
                                rename { fileName -> newName }
                            }
                            println("✅ APK berhasil digandakan dan diganti nama menjadi: ${newFile}")
                        }
                    }
                }
            }
        }
    }
}